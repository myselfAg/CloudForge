---
- name: Update package cache
  ansible.builtin.apt:
    update_cache: yes
    
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Ensure nginx is running
  service:
    name: nginx
    state: started
    enabled: yes

- name: Configure nginx load balancer
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Restart Nginx